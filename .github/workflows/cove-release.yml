name: cove-release

# Builds the static Cloud Hypervisor binaries of a release tag on a
# GitHub-hosted runner: cloud-hypervisor-static-x86_64,
# cloud-hypervisor-static-aarch64, SHA256SUMS, BUILDINFO and
# THIRD-PARTY-NOTICES.txt. Both binaries are cross-built by zig from one x86_64
# job. The recipe is .github/cove-ci/build-static.sh.
#
# A ci-test-* tag runs the same build as a non-release, named by `git describe`,
# which is how a branch that GitHub does not hold gets a run.

on:
  push:
    tags:
      - 'v*-cove.*'
      - 'ci-test-*'

permissions: {}

jobs:
  build:
    name: static binaries
    runs-on: ubuntu-24.04
    # About 5 minutes on 8 CPUs when measured elsewhere; these runners have 4.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      SRC: ${{ github.workspace }}/src
      FORK_SHA: ${{ github.sha }}
      REF: ${{ github.ref_name }}
      RUN_ID: ${{ github.run_id }}
    outputs:
      version: ${{ steps.decide.outputs.version }}
    steps:
      # Plain git and no token: full history and tags, because build.rs runs
      # `git describe` and the release branch is checked below. A test tag is
      # dropped from the clone: annotated, it would be what `git describe` says.
      - name: Check out the tagged commit
        run: |
          git init -q "$SRC"
          cd "$SRC" || exit 1
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --tags origin "$GITHUB_SHA" '+refs/heads/cove-patches-*:refs/remotes/origin/cove-patches-*'
          git checkout -q --detach "$GITHUB_SHA"
          git tag -l 'ci-test-*' | xargs -r git tag -d >/dev/null
          git log -1 --format='checked out %H'
          df -h /

      # CI never mints a tag; this only reads the one that was pushed. A release
      # tag must be well formed, annotated, the only release tag at this commit
      # and on the branch of its own upstream line.
      - name: Decide what is being built
        id: decide
        working-directory: src
        run: |
          refuse() { echo "::error::REFUSING: $*"; exit 64; }
          described=$(git describe --dirty)
          case "$GITHUB_REF_NAME" in
            ci-test-*)
              version=$described
              is_release=false
              ;;
            *)
              tag=$GITHUB_REF_NAME
              .github/cove-ci/version.sh --is-release "$tag" || refuse "tag '$tag' is not a v<upstream>-cove.<n> release tag"
              [ "$(git rev-parse "refs/tags/$tag^{commit}")" = "$GITHUB_SHA" ] || refuse "tag '$tag' does not name $GITHUB_SHA"
              [ "$(git cat-file -t "refs/tags/$tag")" = tag ] || refuse "tag '$tag' is lightweight; build.rs's plain git describe cannot see it"
              others=0
              while IFS= read -r t; do
                if [ "$t" != "$tag" ] && .github/cove-ci/version.sh --is-release "$t"; then others=$((others + 1)); fi
              done < <(git tag --points-at "$GITHUB_SHA")
              [ "$others" -eq 0 ] || refuse "another release tag points at $GITHUB_SHA"
              branch=cove-patches-${tag%-cove.*}
              git rev-parse -q --verify "refs/remotes/origin/$branch" >/dev/null || refuse "no branch $branch"
              git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$branch" || refuse "$GITHUB_SHA is not on $branch"
              [ "$described" = "$tag" ] || refuse "git describe says '$described', so the binary would not print '$tag'"
              version=$tag
              is_release=true
              ;;
          esac
          case "$version" in *[!A-Za-z0-9._-]*|'') refuse "version '$version' is not a plain name" ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IS_RELEASE=$is_release" >> "$GITHUB_ENV"
          echo "building $version from $GITHUB_SHA, release=$is_release"

      # The advisory gate and the refusal of a tree carrying .cargo or
      # rust-toolchain are inside this phase, before any of the tree's code runs.
      - name: Build the static binaries
        run: src/.github/cove-ci/run-recipe.sh build

      - name: Run the block crate's tests
        run: src/.github/cove-ci/run-recipe.sh block-tests

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cloud-hypervisor-static-${{ steps.decide.outputs.version }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  list:
    name: list the files
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cloud-hypervisor-static-${{ needs.build.outputs.version }}
          path: out

      - name: List the files and print their digests
        working-directory: out
        run: |
          want='BUILDINFO
          SHA256SUMS
          THIRD-PARTY-NOTICES.txt
          cloud-hypervisor-static-aarch64
          cloud-hypervisor-static-x86_64'
          [ "$(find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort)" = "$want" ] \
            || { echo "::error::the build's files are not exactly the five agreed names"; exit 1; }
          # -c checks only the lines there are: it must have one for each other file.
          listed='BUILDINFO
          THIRD-PARTY-NOTICES.txt
          cloud-hypervisor-static-aarch64
          cloud-hypervisor-static-x86_64'
          [ "$(LC_ALL=C sort -k2 SHA256SUMS | sed -E 's/^[0-9a-f]{64}  //')" = "$listed" ] \
            || { echo "::error::SHA256SUMS does not list exactly the other four files"; exit 1; }
          sha256sum --strict --status -c SHA256SUMS 2>/dev/null \
            || { echo "::error::the files do not match SHA256SUMS"; exit 1; }
          ls -l
          sha256sum BUILDINFO SHA256SUMS THIRD-PARTY-NOTICES.txt cloud-hypervisor-static-aarch64 cloud-hypervisor-static-x86_64

  # Boots the x86_64 binary and takes it through .github/cove-ci/smoke.sh, which
  # fails unless the running VMM holds an io_uring ring. On the runner directly:
  # Docker's default seccomp profile refuses io_uring.
  # aarch64 is built and attested, not booted (no KVM on hosted arm runners); development use only
  # It also wakes the previous release's checkpoint (step 5) and packs this
  # build's (step 6), which the release job publishes for the next one.
  # A regression check, not a gate against a hostile tree: the smoke runs from the
  # tree under test, so its token reads this public repo and nothing more.
  smoke:
    name: boot on x86_64
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      KERNEL_URL: https://github.com/cloud-hypervisor/linux/releases/download/ch-release-v6.16.9-20260508/vmlinux-x86_64
      KERNEL_SHA256: 9d3570b47d5abb069ca00edfbfcef4c68306a9c3d078a01f10082b258f1001b8
      BUSYBOX_URL: https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox
      BUSYBOX_SHA256: 6e123e7f3202a8c1e9b1f94d8941580a25135382b99e8d3e34fb858bba311348
    steps:
      - name: Check out the tagged commit
        run: |
          set -euo pipefail
          git init -q src
          cd src
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='checked out %H'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cloud-hypervisor-static-${{ needs.build.outputs.version }}
          path: out

      # The artifact came from the tree's code, so only this one fixed name is
      # taken from it, and only when it is a plain file with exactly one digest
      # in SHA256SUMS, checked on the copy that will run.
      - name: Verify the binary against SHA256SUMS
        run: |
          set -euo pipefail
          name=cloud-hypervisor-static-x86_64
          in="$RUNNER_TEMP/smoke/in"
          mkdir -p "$in"
          if [ ! -f "out/$name" ] || [ -L "out/$name" ] || [ ! -f out/SHA256SUMS ] || [ -L out/SHA256SUMS ]; then
            echo "::error::the artifact has no plain files $name and SHA256SUMS"
            exit 1
          fi
          want=$(awk -v n="$name" 'NF == 2 && $2 == n { print $1 }' out/SHA256SUMS)
          if ! [[ "$want" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::SHA256SUMS does not give $name exactly one sha256"
            exit 1
          fi
          install -m 0755 "out/$name" "$in/cloud-hypervisor"
          got=$(sha256sum < "$in/cloud-hypervisor")
          got=${got%% *}
          if [ "$got" != "$want" ]; then
            echo "::error::$name is $got, but SHA256SUMS says $want"
            exit 1
          fi
          echo "$name $got"

      - name: Fetch the kernel and busybox, build the initramfs
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/smoke/in"
          curl -fsSL --retry 3 --proto =https --proto-redir =https --max-time 600 -o "$in/vmlinux" "$KERNEL_URL"
          curl -fsSL --retry 3 --proto =https --proto-redir =https --max-time 600 -o "$RUNNER_TEMP/smoke/busybox" "$BUSYBOX_URL"
          echo "$KERNEL_SHA256  $in/vmlinux" | sha256sum -c -
          echo "$BUSYBOX_SHA256  $RUNNER_TEMP/smoke/busybox" | sha256sum -c -
          python3 src/.github/cove-ci/smoke_tool.py initramfs --busybox "$RUNNER_TEMP/smoke/busybox" --out "$in/initramfs.cpio.gz"

      - name: Make /dev/kvm usable
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sleep 1
          ls -l /dev/kvm

      # The previous release is the highest v<upstream>-cove.<n> below this
      # version, by version.sh's ordering, that has a GitHub Release; a test
      # build past a release tag counts that tag as below it. No such Release,
      # or one without a checkpoint (the first GitHub release has none): step 5
      # is skipped. Anything else that goes wrong fails the job: the checkpoint
      # is used only when its attestation names this workflow and its sha256
      # matches the one published beside it.
      - name: Fetch the previous release's checkpoint
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          v=src/.github/cove-ci/version.sh
          name=ch-smoke-checkpoint.tar.gz
          below() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n 1)" = "$1" ] && [ "$1" != "$2" ]; }
          base=${VERSION%-dirty}
          base=$(sed -E 's/-[0-9]+-g[0-9a-f]+$//' <<<"$base")
          at_or_below=false
          if "$v" --is-release "$base"; then
            [ "$base" = "$VERSION" ] || at_or_below=true
          elif [[ "$base" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            base=$base-cove.1
          else
            echo "::error::cannot order version '$VERSION' against release tags"; exit 1
          fi
          bound=$("$v" --sort-key "$base")
          prev='' prev_key=''
          tags=$(gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName')
          while IFS= read -r t; do
            [ -n "$t" ] && "$v" --is-release "$t" || continue
            k=$("$v" --sort-key "$t")
            { below "$k" "$bound" || { [ "$at_or_below" = true ] && [ "$k" = "$bound" ]; }; } || continue
            if [ -z "$prev" ] || below "$prev_key" "$k"; then prev=$t prev_key=$k; fi
          done <<<"$tags"
          if [ -z "$prev" ]; then
            echo "::notice::step 5 will be SKIPPED: no GitHub Release below $VERSION"; exit 0
          fi
          assets=$(gh release view "$prev" --json assets --jq '.assets[].name')
          if ! grep -qxF "$name" <<<"$assets"; then
            echo "::notice::step 5 will be SKIPPED: release $prev has no $name"; exit 0
          fi
          dl="$RUNNER_TEMP/previous"
          mkdir "$dl"
          gh release download "$prev" --dir "$dl" --pattern "$name" --pattern "$name.sha256"
          [ -f "$dl/$name" ] && [ ! -L "$dl/$name" ] && [ -f "$dl/$name.sha256" ] \
            || { echo "::error::release $prev did not give both $name and $name.sha256"; exit 1; }
          gh attestation verify "$dl/$name" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cove-release.yml"
          want=$(awk -v n="$name" 'NF == 2 && $2 == n { print $1 }' "$dl/$name.sha256")
          got=$(sha256sum < "$dl/$name"); got=${got%% *}
          if ! [[ "$want" =~ ^[0-9a-f]{64}$ ]] || [ "$got" != "$want" ]; then
            echo "::error::$prev's $name is $got, but its $name.sha256 says '$want'"; exit 1
          fi
          install -m 0644 "$dl/$name" "$RUNNER_TEMP/smoke/in/previous.tar.gz"
          echo "step 5 will wake $prev's checkpoint, sha256 $got"

      - name: Run the smoke
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke/out"
          # What the binary under test prints reaches this log: none of it runs
          # as a workflow command.
          echo "::stop-commands::$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          printf '%s\n' "$VERSION" > "$RUNNER_TEMP/smoke/in/VERSION"
          bash src/.github/cove-ci/smoke.sh --in "$RUNNER_TEMP/smoke/in" --work "$RUNNER_TEMP/smoke/work" \
            --out "$RUNNER_TEMP/smoke/out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ch-smoke-checkpoint-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/smoke/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The one job holding a write token, and only for a release tag; a ci-test-*
  # tag never gets here. It runs nothing from the tree and prints nothing from
  # the artifact. The attestation comes first, so a Release never exists without one.
  # It also publishes the smoke's checkpoint, attested, for the next release's step 5.
  release:
    name: attest and publish
    needs: [build, list, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the tag is the version that was built
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "::error::the tag is not the version the build job decided on"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cloud-hypervisor-static-${{ needs.build.outputs.version }}
          path: out

      - name: Verify the five files
        working-directory: out
        run: |
          set -euo pipefail
          want='f BUILDINFO
          f SHA256SUMS
          f THIRD-PARTY-NOTICES.txt
          f cloud-hypervisor-static-aarch64
          f cloud-hypervisor-static-x86_64'
          [ "$(find . -mindepth 1 -printf '%y %P\n' | LC_ALL=C sort)" = "$want" ] \
            || { echo "::error::the build's files are not exactly the five agreed names, all plain files"; exit 1; }
          # -c checks only the lines there are: it must have one for each other file.
          listed='BUILDINFO
          THIRD-PARTY-NOTICES.txt
          cloud-hypervisor-static-aarch64
          cloud-hypervisor-static-x86_64'
          [ "$(LC_ALL=C sort -k2 SHA256SUMS | sed -E 's/^[0-9a-f]{64}  //')" = "$listed" ] \
            || { echo "::error::SHA256SUMS does not list exactly the other four files"; exit 1; }
          sha256sum --strict --status -c SHA256SUMS 2>/dev/null \
            || { echo "::error::the files do not match SHA256SUMS"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ch-smoke-checkpoint-${{ needs.build.outputs.version }}
          path: smoke

      # Its own .sha256 file, published beside it: SHA256SUMS stays the build's.
      - name: Verify the smoke's checkpoint
        working-directory: smoke
        run: |
          set -euo pipefail
          want='f ch-smoke-checkpoint.tar.gz
          f ch-smoke-checkpoint.tar.gz.sha256'
          [ "$(find . -mindepth 1 -printf '%y %P\n' | LC_ALL=C sort)" = "$want" ] \
            || { echo "::error::the smoke's files are not exactly the checkpoint and its .sha256, both plain files"; exit 1; }
          [ "$(sed -E 's/^[0-9a-f]{64}  //' ch-smoke-checkpoint.tar.gz.sha256)" = ch-smoke-checkpoint.tar.gz ] \
            || { echo "::error::ch-smoke-checkpoint.tar.gz.sha256 is not one line for the checkpoint"; exit 1; }
          sha256sum --strict --status -c ch-smoke-checkpoint.tar.gz.sha256 2>/dev/null \
            || { echo "::error::the checkpoint does not match its .sha256"; exit 1; }

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            out/cloud-hypervisor-static-x86_64
            out/cloud-hypervisor-static-aarch64
            smoke/ch-smoke-checkpoint.tar.gz

      - name: Create the Release
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Both binaries and the smoke checkpoint carry a build provenance attestation: gh attestation verify FILE --repo $GH_REPO" \
            SHA256SUMS cloud-hypervisor-static-x86_64 cloud-hypervisor-static-aarch64 BUILDINFO THIRD-PARTY-NOTICES.txt \
            ../smoke/ch-smoke-checkpoint.tar.gz ../smoke/ch-smoke-checkpoint.tar.gz.sha256
