name: cove-release

# Builds the static Cloud Hypervisor binaries of a release tag on a
# GitHub-hosted runner: cloud-hypervisor-static-x86_64,
# cloud-hypervisor-static-aarch64, SHA256SUMS, BUILDINFO and
# THIRD-PARTY-NOTICES.txt. Both binaries are cross-built by zig from one x86_64
# job. The recipe is .github/cove-ci/build-static.sh.
#
# A ci-test-* tag runs the same build as a non-release, named by `git describe`,
# which is how a branch that GitHub does not hold gets a run.

on:
  push:
    tags:
      - 'v*-cove.*'
      - 'ci-test-*'

permissions: {}

jobs:
  build:
    name: static binaries
    runs-on: ubuntu-24.04
    # About 5 minutes on 8 CPUs when measured elsewhere; these runners have 4.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      SRC: ${{ github.workspace }}/src
      FORK_SHA: ${{ github.sha }}
      REF: ${{ github.ref_name }}
      RUN_ID: ${{ github.run_id }}
    outputs:
      version: ${{ steps.decide.outputs.version }}
    steps:
      # Plain git and no token: full history and tags, because build.rs runs
      # `git describe` and the release branch is checked below. A test tag is
      # dropped from the clone: annotated, it would be what `git describe` says.
      - name: Check out the tagged commit
        run: |
          git init -q "$SRC"
          cd "$SRC" || exit 1
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --tags origin "$GITHUB_SHA" '+refs/heads/cove-patches-*:refs/remotes/origin/cove-patches-*'
          git checkout -q --detach "$GITHUB_SHA"
          git tag -l 'ci-test-*' | xargs -r git tag -d >/dev/null
          git log -1 --format='checked out %H'
          df -h /

      # CI never mints a tag; this only reads the one that was pushed. A release
      # tag must be well formed, annotated, the only release tag at this commit
      # and on the branch of its own upstream line.
      - name: Decide what is being built
        id: decide
        working-directory: src
        run: |
          refuse() { echo "::error::REFUSING: $*"; exit 64; }
          described=$(git describe --dirty)
          case "$GITHUB_REF_NAME" in
            ci-test-*)
              version=$described
              is_release=false
              ;;
            *)
              tag=$GITHUB_REF_NAME
              .github/cove-ci/version.sh --is-release "$tag" || refuse "tag '$tag' is not a v<upstream>-cove.<n> release tag"
              [ "$(git rev-parse "refs/tags/$tag^{commit}")" = "$GITHUB_SHA" ] || refuse "tag '$tag' does not name $GITHUB_SHA"
              [ "$(git cat-file -t "refs/tags/$tag")" = tag ] || refuse "tag '$tag' is lightweight; build.rs's plain git describe cannot see it"
              others=0
              while IFS= read -r t; do
                if [ "$t" != "$tag" ] && .github/cove-ci/version.sh --is-release "$t"; then others=$((others + 1)); fi
              done < <(git tag --points-at "$GITHUB_SHA")
              [ "$others" -eq 0 ] || refuse "another release tag points at $GITHUB_SHA"
              branch=cove-patches-${tag%-cove.*}
              git rev-parse -q --verify "refs/remotes/origin/$branch" >/dev/null || refuse "no branch $branch"
              git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$branch" || refuse "$GITHUB_SHA is not on $branch"
              [ "$described" = "$tag" ] || refuse "git describe says '$described', so the binary would not print '$tag'"
              version=$tag
              is_release=true
              ;;
          esac
          case "$version" in *[!A-Za-z0-9._-]*|'') refuse "version '$version' is not a plain name" ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IS_RELEASE=$is_release" >> "$GITHUB_ENV"
          echo "building $version from $GITHUB_SHA, release=$is_release"

      # The advisory gate and the refusal of a tree carrying .cargo or
      # rust-toolchain are inside this phase, before any of the tree's code runs.
      - name: Build the static binaries
        run: src/.github/cove-ci/run-recipe.sh build

      - name: Run the block crate's tests
        run: src/.github/cove-ci/run-recipe.sh block-tests

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cloud-hypervisor-static-${{ steps.decide.outputs.version }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  list:
    name: list the files
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cloud-hypervisor-static-${{ needs.build.outputs.version }}
          path: out

      - name: List the files and print their digests
        working-directory: out
        run: |
          want='BUILDINFO
          SHA256SUMS
          THIRD-PARTY-NOTICES.txt
          cloud-hypervisor-static-aarch64
          cloud-hypervisor-static-x86_64'
          [ "$(find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort)" = "$want" ] \
            || { echo "::error::the build's files are not exactly the five agreed names"; exit 1; }
          sha256sum --strict --status -c SHA256SUMS 2>/dev/null \
            || { echo "::error::the files do not match SHA256SUMS"; exit 1; }
          ls -l
          sha256sum BUILDINFO SHA256SUMS THIRD-PARTY-NOTICES.txt cloud-hypervisor-static-aarch64 cloud-hypervisor-static-x86_64

  # THE RELEASE JOB GOES HERE, in a later change: `needs: list`, its own
  # `permissions`, publishing these five files and attesting each binary. This
  # workflow publishes nothing today and no job in it holds a write token.
